name: release

on:
  push:
    tags:
      - "v*"
      - "!v*-linux*"
      - "!v*-macos*"

  workflow_run:
    workflows: ["build"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-windows
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Validate explicit release plan and trusted source commit
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare-release.py windows

      - uses: actions/setup-dotnet@v5
        if: steps.prepare.outputs.publish == 'true'
        with:
          dotnet-version: 8.0.x

      - name: Verify Windows tag matches application version
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/ToastifyReloaded/ToastifyReloaded.csproj -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($env:RELEASE_TAG -notin @("v$version", "v.$version")) {
            throw "Windows tag does not match application version $version"
          }
          Write-Host "PASS: Windows tag matches application version $version"

      - name: Install NSIS
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Test release versions and Spotify track links
        if: steps.prepare.outputs.publish == 'true'
        run: dotnet run --project tests/ToastifyReloaded.TrackLink.Tests -c Release

      - name: Test versioned package feeds and immutable delta bases
        if: steps.prepare.outputs.publish == 'true'
        run: python scripts/test-velopack-release.py

      - name: Install pinned Velopack CLI
        if: steps.prepare.outputs.publish == 'true'
        run: dotnet tool install vpk --version 1.2.161 --tool-path .tools/vpk

      - name: Test migration and rollback without installing
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: .\scripts\test-windows-package-migration.ps1

      - name: Verify synthetic delta chain and corrupt-delta full fallback
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: |
          $report = python scripts/test-velopack-delta.py --vpk .tools/vpk/vpk.exe --package-id ToastifyReloaded --versions 1.3.10 1.3.11 1.3.12 --keep-fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Native delta probe failed' }
          $probe = $report | ConvertFrom-Json
          $helper = (Resolve-Path .tools/vpk/.store/vpk/1.2.161/vpk/1.2.161/vendor/update_x64.exe).Path
          "TOASTIFY_VELOPACK_FIXTURES=$($probe.fixture_directory)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TOASTIFY_VELOPACK_PATCH_HELPER=$helper" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host $report

      - name: Test Windows features and real updater patch-only full fallback
        if: steps.prepare.outputs.publish == 'true'
        run: dotnet run --project tests/ToastifyReloaded.Windows.Tests -c Release

      - name: Build and verify Windows x64 and ARM64 packages
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content src/ToastifyReloaded/ToastifyReloaded.csproj -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          foreach ($runtime in @('win-x64', 'win-arm64')) {
            $base = "artifacts/velopack-base/$runtime"
            python scripts/prepare-velopack-base.py --version $version --runtime $runtime --output $base
            if ($LASTEXITCODE -ne 0) { throw "Previous-release verification failed for $runtime" }
            .\scripts\build-windows-packages.ps1 -Runtime $runtime -PreviousReleaseDir $base
          }
          python scripts/finalize-velopack-release.py --directory dist/windows-release --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Windows publication contract validation failed' }

      - name: Upload verified packages to a private draft
        if: steps.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.release_tag }}
          target_commitish: ${{ steps.prepare.outputs.release_sha }}
          name: Toastify Reloaded ${{ steps.prepare.outputs.release_tag }}
          body_path: ${{ steps.prepare.outputs.notes_path }}
          generate_release_notes: false
          draft: true
          make_latest: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/windows-release/*

      - name: Verify uploaded feed hashes and publish complete release
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ steps.prepare.outputs.release_sha }}
        run: python scripts/publish-windows-release.py --tag $env:RELEASE_TAG --sha $env:RELEASE_SOURCE_SHA --directory dist/windows-release

      - name: Upload delta validation evidence
        if: always() && steps.prepare.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-release-validation
          path: |
            artifacts/velopack-delta-probe.json
            artifacts/velopack-base/**/base.json
          if-no-files-found: ignore
