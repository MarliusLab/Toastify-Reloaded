name: release

on:
  push:
    tags:
      - "v*"
      - "!v*-linux*"
      - "!v*-macos*"

  workflow_run:
    workflows: ["build", "Linux Build", "macOS Build"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-windows
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Require all three tested main builds and an immutable release target
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare-release.py windows

      - name: Download the verified Windows packages from their exact main build
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/download-artifact@v5
        with:
          name: ToastifyReloaded-Windows-packages
          path: dist/windows-release
          github-token: ${{ github.token }}
          run-id: ${{ steps.prepare.outputs.windows_build_run }}

      - name: Verify downloaded Windows feeds, packages and checksums without rebuilding
        if: steps.prepare.outputs.publish == 'true'
        shell: pwsh
        run: |
          $validation = @'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from velopack_release import validate_stage
          validate_stage(Path("dist/windows-release"), os.environ["RELEASE_TAG"].removeprefix("v"))
          '@
          $validation | python -
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded Windows package verification failed' }

      - name: Upload verified packages to a private draft
        id: upload
        if: steps.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.release_tag }}
          target_commitish: ${{ steps.prepare.outputs.release_sha }}
          name: Toastify Reloaded ${{ steps.prepare.outputs.release_tag }}
          body_path: ${{ steps.prepare.outputs.notes_path }}
          generate_release_notes: false
          draft: true
          make_latest: false
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/windows-release/*

      - name: Verify uploaded feed hashes and publish the complete stable release
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ steps.prepare.outputs.release_sha }}
          RELEASE_ID: ${{ steps.upload.outputs.id }}
        run: python scripts/publish-windows-release.py --tag $env:RELEASE_TAG --sha $env:RELEASE_SOURCE_SHA --release-id $env:RELEASE_ID --directory dist/windows-release
