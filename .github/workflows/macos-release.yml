name: macOS Release

on:
  push:
    tags:
      - "v*-macos"
      - "v*-macos-preview.*"
      - "v*-macos-rc.*"

  workflow_run:
    workflows: ["build", "Linux Build", "macOS Build"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-macos
  cancel-in-progress: false

jobs:
  release-macos:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Require all three tested main builds and an immutable release target
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare-release.py macos

      - name: Download signed and tested macOS packages from their exact main build
        if: steps.prepare.outputs.publish == 'true'
        uses: actions/download-artifact@v5
        with:
          name: toastify-reloaded-macos
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.prepare.outputs.macos_build_run }}

      - name: Verify original checksums and prepare the exact public macOS asset set
        if: steps.prepare.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="${PACKAGE_VERSION/-macos/}"
          python scripts/portable-release.py --platform macos --version "$PACKAGE_VERSION" --directory dist --verify-inputs --finalize --stage-directory dist/native-release

      - name: Upload verified macOS packages to a private draft
        id: upload
        if: steps.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prepare.outputs.release_tag }}
          target_commitish: ${{ steps.prepare.outputs.release_sha }}
          name: Toastify Reloaded ${{ steps.prepare.outputs.release_tag }}
          body_path: ${{ steps.prepare.outputs.notes_path }}
          generate_release_notes: false
          draft: true
          make_latest: false
          prerelease: ${{ steps.prepare.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: dist/native-release/*

      - name: Verify uploaded macOS feeds and publish the complete release
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          RELEASE_SOURCE_SHA: ${{ steps.prepare.outputs.release_sha }}
          RELEASE_ID: ${{ steps.upload.outputs.id }}
        run: python scripts/publish-portable-release.py --platform macos --directory dist/native-release --tag "$RELEASE_TAG" --source-sha "$RELEASE_SOURCE_SHA" --release-id "$RELEASE_ID"
