name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Verify classic Toastify UI invariants
        shell: pwsh
        run: .\scripts\verify-classic-ui.ps1

      - name: Test release authorization and immutable tags
        run: python scripts/test-prepare-release.py

      - name: Test release versions and Spotify track links
        run: dotnet run --project tests/ToastifyReloaded.TrackLink.Tests -c Release

      - name: Test Windows Now Playing, toast shortcuts, detection and updates
        run: dotnet run --project tests/ToastifyReloaded.Windows.Tests -c Release

      - name: Upload maintenance UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-maintenance-UI-preview
          path: artifacts/windows-maintenance-progress.png
          if-no-files-found: ignore

      - name: Restore
        run: dotnet restore .\ToastifyReloaded.sln

      - name: Build
        run: dotnet build .\ToastifyReloaded.sln -c Release --no-restore

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build Windows x64 installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Runtime win-x64

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToastifyReloaded-Setup-win-x64
          path: dist/ToastifyReloaded-Setup-win-x64.exe
