name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Verify classic Toastify UI invariants
        shell: pwsh
        run: .\scripts\verify-classic-ui.ps1

      - name: Test release authorization and immutable tags
        run: python scripts/test-prepare-release.py

      - name: Test versioned package feeds and immutable delta bases
        run: python scripts/test-velopack-release.py

      - name: Test release versions and Spotify track links
        run: dotnet run --project tests/ToastifyReloaded.TrackLink.Tests -c Release

      - name: Restore
        run: dotnet restore .\ToastifyReloaded.sln

      - name: Build
        run: dotnet build .\ToastifyReloaded.sln -c Release --no-restore

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install pinned Velopack CLI
        run: dotnet tool install vpk --version 1.2.161 --tool-path .tools/vpk

      - name: Test migration and rollback without installing
        shell: pwsh
        run: .\scripts\test-windows-package-migration.ps1

      - name: Verify synthetic delta chain and corrupt-delta full fallback
        shell: pwsh
        run: |
          $report = python scripts/test-velopack-delta.py --vpk .tools/vpk/vpk.exe --package-id ToastifyReloaded --versions 1.3.10 1.3.11 1.3.12 --keep-fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Native delta probe failed' }
          $probe = $report | ConvertFrom-Json
          $helper = (Resolve-Path .tools/vpk/.store/vpk/1.2.161/vpk/1.2.161/vendor/update_x64.exe).Path
          "TOASTIFY_VELOPACK_FIXTURES=$($probe.fixture_directory)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TOASTIFY_VELOPACK_PATCH_HELPER=$helper" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host $report

      - name: Test Windows features and real updater patch-only full fallback
        run: dotnet run --project tests/ToastifyReloaded.Windows.Tests -c Release

      - name: Upload maintenance UI preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-maintenance-UI-preview
          path: artifacts/windows-maintenance-progress.png
          if-no-files-found: ignore

      - name: Build and verify Windows x64 and ARM64 packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content src/ToastifyReloaded/ToastifyReloaded.csproj -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          foreach ($runtime in @('win-x64', 'win-arm64')) {
            $base = "artifacts/velopack-base/$runtime"
            python scripts/prepare-velopack-base.py --version $version --runtime $runtime --output $base
            if ($LASTEXITCODE -ne 0) { throw "Previous-release verification failed for $runtime" }
            .\scripts\build-windows-packages.ps1 -Runtime $runtime -PreviousReleaseDir $base
          }
          python scripts/finalize-velopack-release.py --directory dist/windows-release --version $version
          if ($LASTEXITCODE -ne 0) { throw 'Windows publication contract validation failed' }

      - name: Upload verified Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: ToastifyReloaded-Windows-packages
          path: dist/windows-release/*
          if-no-files-found: error

      - name: Upload delta and migration validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-delta-validation
          path: |
            artifacts/velopack-delta-probe.json
            artifacts/velopack-base/**/base.json
          if-no-files-found: ignore
