name: Linux Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  linux-x64:
    name: Ubuntu 24.04 · x64 build + GUI smoke + packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            playerctl xbindkeys xdg-desktop-portal dbus-x11 xdg-utils \
            libx11-6 libice6 libsm6 libfontconfig1 libxext6 \
            libxrender1 libxrandr2 libxi6 libgl1 libglib2.0-0 \
            desktop-file-utils curl xvfb xauth file

      - name: Verify permanent three-platform parity policy
        run: python scripts/verify-platform-parity.py

      - name: Test release authorization and immutable tags
        run: python scripts/test-prepare-release.py

      - name: Test native package feeds and immutable publication
        run: python scripts/test-portable-release.py

      - name: Test track links and safe launcher fallbacks
        run: dotnet run --project tests/ToastifyReloaded.TrackLink.Tests -c Release

      - name: Test real timed Linux and macOS toast lifetimes without opening windows
        run: |
          dotnet build tests/ToastifyReloaded.Avalonia.Tests -c Release --nologo -m:1
          dotnet run --project tests/ToastifyReloaded.Avalonia.Tests -c Release --no-build

      - name: Install pinned Velopack CLI
        run: dotnet tool install vpk --version 1.2.161 --tool-path .tools/vpk

      - name: Build Linux x64
        run: |
          chmod +x scripts/build-linux.sh
          ./scripts/build-linux.sh

      - name: Verify stable feature contract
        run: |
          grep -q 'Avalonia.Wayland' src/ToastifyReloaded.Linux/ToastifyReloaded.Linux.csproj
          grep -q 'Tmds.DBus' src/ToastifyReloaded.Linux/ToastifyReloaded.Linux.csproj
          grep -q 'TrayIcon.Icons' src/ToastifyReloaded.Linux/App.axaml
          grep -q 'GetSelfAndLogicalDescendants' src/ToastifyReloaded.Linux/Services/LocalizationService.cs
          grep -q 'SaveFilePickerAsync' src/ToastifyReloaded.Linux/MainWindow.axaml.cs
          grep -q 'CompatibilityGuardService' src/ToastifyReloaded.Linux/MainWindow.axaml.cs
          grep -q 'api.github.com/repos/MarliusLab/Toastify-Reloaded/releases' src/ToastifyReloaded.Linux/Services/LinuxUpdateService.cs
          grep -q 'CustomTopColor' src/ToastifyReloaded.Linux/Models/LinuxSettings.cs
          grep -q 'ToastPosition' src/ToastifyReloaded.Linux/Models/LinuxSettings.cs
          grep -q 'MonitorCombo' src/ToastifyReloaded.Linux/MainWindow.axaml
          grep -q 'ToastFontCombo' src/ToastifyReloaded.Linux/MainWindow.axaml
          grep -q 'LinuxUpdateInstallerService' src/ToastifyReloaded.Linux/MainWindow.axaml.cs
          grep -q 'DownloadAndApplyAsync' src/ToastifyReloaded.Linux/Services/LinuxUpdateInstallerService.cs
          grep -q 'public const string CurrentTag =' src/ToastifyReloaded.Linux/Services/LinuxUpdateService.cs
          grep -q 'ReleaseCandidate' src/ToastifyReloaded.Linux/Models/LinuxReleaseVersion.cs
          grep -q 'SELF-TEST RESULT: PASS' src/ToastifyReloaded.Linux/Services/LinuxSelfTestService.cs
          grep -q 'Custom' src/ToastifyReloaded.Linux/Models/ToastThemePalette.cs

      - name: Linux stable headless self-test
        run: |
          chmod +x scripts/test-linux-rc.sh
          ./scripts/test-linux-rc.sh

      - name: Linux GUI smoke test
        run: |
          chmod +x scripts/test-linux-ci.sh
          ./scripts/test-linux-ci.sh

      - name: Validate Linux desktop entry
        run: |
          desktop-file-validate packaging/linux/io.github.Marlius92.ToastifyReloaded.desktop

      - name: Package x64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/package-linux-tar.sh scripts/package-linux-deb.sh scripts/package-linux-velopack.sh
          ./scripts/package-linux-tar.sh
          ./scripts/package-linux-deb.sh
          ./scripts/package-linux-velopack.sh x64 1.4.4
          VERSION="$(sed -nE 's/.*<Version>([^<]+)<\/Version>.*/\1/p' src/ToastifyReloaded.Linux/ToastifyReloaded.Linux.csproj)"
          TARGET="dist/ToastifyReloadedLinux-$VERSION-linux-x64-full.nupkg"
          OLD="$(find dist/velopack/linux-x64 -maxdepth 1 -name 'ToastifyReloadedLinux-*-linux-x64-full.nupkg' ! -name "${TARGET##*/}" -print -quit)"
          test -n "$OLD"
          mkdir -p artifacts
          python3 scripts/test-native-portable-delta.py \
            --helper .tools/vpk/.store/vpk/1.2.161/vpk/1.2.161/vendor/UpdateNix_x64 \
            --old "$OLD" --delta "dist/ToastifyReloadedLinux-$VERSION-linux-x64-delta.nupkg" --target "$TARGET" \
            --output-directory artifacts/native-linux-x64-delta | tee artifacts/native-linux-x64-delta-result.json

      - name: Upload x64 native delta diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: toastify-reloaded-linux-x64-native-delta-diagnostics
          if-no-files-found: ignore
          path: |
            artifacts/native-linux-x64-delta-result.json
            artifacts/native-linux-x64-delta/*.log
            artifacts/native-linux-x64-delta/*console.txt

      - name: Verify native Velopack AppImage startup
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE_EXTRACT_AND_RUN=1 dist/ToastifyReloaded-Linux-x64.AppImage --self-test
          TOASTIFY_SMOKE_APP="$GITHUB_WORKSPACE/dist/ToastifyReloaded-Linux-x64.AppImage" TOASTIFY_SMOKE_LOG="$GITHUB_WORKSPACE/dist/linux-appimage-smoke.log" APPIMAGE_EXTRACT_AND_RUN=1 ./scripts/test-linux-ci.sh
          test -s dist/ToastifyReloadedLinux-1.4.4-linux-x64-full.nupkg
          test -s dist/releases.linux-x64.json
          test -s dist/SHA256SUMS-linux-x64.txt

      - name: Validate x64 deb
        shell: bash
        run: |
          set -euo pipefail

          DEB="$(find dist -maxdepth 1 -name 'toastify-reloaded_*_amd64.deb' -print -quit)"
          test -n "$DEB"
          test -s "$DEB"

          CONTENTS_FILE="$RUNNER_TEMP/toastify-deb-contents.txt"
          dpkg-deb --contents "$DEB" > "$CONTENTS_FILE"
          dpkg-deb --field "$DEB" Depends | tr ',' '\n' | grep -Eq '(^|[[:space:]])libglib2\.0-bin([[:space:](]|$)'

          grep -Fq '/opt/toastify-reloaded/ToastifyReloaded.Linux' "$CONTENTS_FILE"
          grep -Fq '/usr/bin/toastify-reloaded' "$CONTENTS_FILE"
          grep -Fq '/usr/share/applications/io.github.Marlius92.ToastifyReloaded.desktop' "$CONTENTS_FILE"

      - name: Validate x64 artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/ToastifyReloaded-Linux-x64.tar.gz
          test -s dist/ToastifyReloaded-Linux-x64.AppImage
          test -x dist/ToastifyReloaded-Linux-x64.AppImage

          DEB="$(find dist -maxdepth 1 -name 'toastify-reloaded_*_amd64.deb' -print -quit)"
          test -n "$DEB"
          test -s "$DEB"

          TAR_CONTENTS="$RUNNER_TEMP/toastify-x64-tar-contents.txt"
          tar -tzf dist/ToastifyReloaded-Linux-x64.tar.gz > "$TAR_CONTENTS"
          grep -Fq 'ToastifyReloaded.Linux' "$TAR_CONTENTS"

          echo "=== x64 artifact sizes ==="
          ls -lh \
            dist/ToastifyReloaded-Linux-x64.tar.gz \
            dist/ToastifyReloaded-Linux-x64.AppImage \
            "$DEB"

          echo "=== x64 SHA-256 ==="
          sha256sum \
            dist/ToastifyReloaded-Linux-x64.tar.gz \
            dist/ToastifyReloaded-Linux-x64.AppImage \
            "$DEB"

      - uses: actions/upload-artifact@v7
        with:
          name: toastify-reloaded-linux-x64
          path: |
            dist/ToastifyReloaded-Linux-x64.tar.gz
            dist/ToastifyReloaded-Linux-x64.AppImage
            dist/toastify-reloaded_*_amd64.deb
            dist/*.nupkg
            dist/releases.linux-x64.json
            dist/RELEASES-linux-x64
            dist/SHA256SUMS-linux-x64.txt
            dist/linux-smoke-test.log
            dist/linux-appimage-smoke.log
            dist/linux-release-self-test.log
          if-no-files-found: error

  linux-arm64:
    name: Ubuntu 24.04 · ARM64 native build + packages
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file playerctl xbindkeys xdg-utils libx11-6 libice6 libsm6 libfontconfig1 libxext6 libxrender1 libxrandr2 libxi6 libgl1 libglib2.0-0 desktop-file-utils xvfb xauth dbus-x11 xdg-desktop-portal

      - name: Install pinned Velopack CLI
        run: dotnet tool install vpk --version 1.2.161 --tool-path .tools/vpk

      - name: Build Linux ARM64
        run: |
          chmod +x scripts/build-linux-arm64.sh
          ./scripts/build-linux-arm64.sh

      - name: Validate ARM64 executable
        shell: bash
        run: |
          set -euo pipefail

          test -x dist/linux-arm64/ToastifyReloaded.Linux

          FILE_INFO="$RUNNER_TEMP/toastify-arm64-file.txt"
          file dist/linux-arm64/ToastifyReloaded.Linux > "$FILE_INFO"
          cat "$FILE_INFO"
          grep -Eiq 'ARM aarch64|ARM64|aarch64' "$FILE_INFO"

      - name: Package ARM64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/package-linux-arm64-tar.sh scripts/package-linux-arm64-deb.sh scripts/package-linux-velopack.sh
          ./scripts/package-linux-arm64-tar.sh
          ./scripts/package-linux-arm64-deb.sh
          ./scripts/package-linux-velopack.sh arm64 1.4.4
          VERSION="$(sed -nE 's/.*<Version>([^<]+)<\/Version>.*/\1/p' src/ToastifyReloaded.Linux/ToastifyReloaded.Linux.csproj)"
          TARGET="dist/ToastifyReloadedLinux-$VERSION-linux-arm64-full.nupkg"
          OLD="$(find dist/velopack/linux-arm64 -maxdepth 1 -name 'ToastifyReloadedLinux-*-linux-arm64-full.nupkg' ! -name "${TARGET##*/}" -print -quit)"
          test -n "$OLD"
          mkdir -p artifacts
          python3 scripts/test-native-portable-delta.py \
            --helper .tools/vpk/.store/vpk/1.2.161/vpk/1.2.161/vendor/UpdateNix_arm64 \
            --old "$OLD" --delta "dist/ToastifyReloadedLinux-$VERSION-linux-arm64-delta.nupkg" --target "$TARGET" \
            --output-directory artifacts/native-linux-arm64-delta | tee artifacts/native-linux-arm64-delta-result.json
          APPIMAGE_EXTRACT_AND_RUN=1 dist/ToastifyReloaded-Linux-arm64.AppImage --self-test
          chmod +x scripts/test-linux-ci.sh
          TOASTIFY_SMOKE_APP="$GITHUB_WORKSPACE/dist/ToastifyReloaded-Linux-arm64.AppImage" TOASTIFY_SMOKE_LOG="$GITHUB_WORKSPACE/dist/linux-arm64-appimage-smoke.log" APPIMAGE_EXTRACT_AND_RUN=1 ./scripts/test-linux-ci.sh

      - name: Upload ARM64 native delta diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: toastify-reloaded-linux-arm64-native-delta-diagnostics
          if-no-files-found: ignore
          path: |
            artifacts/native-linux-arm64-delta-result.json
            artifacts/native-linux-arm64-delta/*.log
            artifacts/native-linux-arm64-delta/*console.txt

      - name: Validate ARM64 artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -s dist/ToastifyReloaded-Linux-arm64.tar.gz

          DEB="$(find dist -maxdepth 1 -name 'toastify-reloaded_*_arm64.deb' -print -quit)"
          test -n "$DEB"
          test -s "$DEB"

          DEB_INFO="$RUNNER_TEMP/toastify-arm64-deb-info.txt"
          dpkg-deb --info "$DEB" > "$DEB_INFO"
          grep -Fq 'Architecture: arm64' "$DEB_INFO"
          dpkg-deb --field "$DEB" Depends | tr ',' '\n' | grep -Eq '(^|[[:space:]])libglib2\.0-bin([[:space:](]|$)'

          TAR_CONTENTS="$RUNNER_TEMP/toastify-arm64-tar-contents.txt"
          tar -tzf dist/ToastifyReloaded-Linux-arm64.tar.gz > "$TAR_CONTENTS"
          grep -Fq 'ToastifyReloaded.Linux' "$TAR_CONTENTS"

          echo "=== ARM64 artifact sizes ==="
          ls -lh \
            dist/ToastifyReloaded-Linux-arm64.tar.gz \
            dist/ToastifyReloaded-Linux-arm64.AppImage \
            dist/*.nupkg \
            dist/releases.linux-arm64.json \
            dist/RELEASES-linux-arm64 \
            dist/SHA256SUMS-linux-arm64.txt \
            "$DEB"

          echo "=== ARM64 SHA-256 ==="
          sha256sum \
            dist/ToastifyReloaded-Linux-arm64.tar.gz \
            dist/ToastifyReloaded-Linux-arm64.AppImage \
            dist/*.nupkg \
            dist/releases.linux-arm64.json \
            dist/RELEASES-linux-arm64 \
            dist/SHA256SUMS-linux-arm64.txt \
            "$DEB"

      - uses: actions/upload-artifact@v7
        with:
          name: toastify-reloaded-linux-arm64
          path: |
            dist/ToastifyReloaded-Linux-arm64.tar.gz
            dist/ToastifyReloaded-Linux-arm64.AppImage
            dist/*.nupkg
            dist/releases.linux-arm64.json
            dist/RELEASES-linux-arm64
            dist/SHA256SUMS-linux-arm64.txt
            dist/linux-arm64-appimage-smoke.log
            dist/toastify-reloaded_*_arm64.deb
          if-no-files-found: error
