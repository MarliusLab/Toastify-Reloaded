name: Linux Release

on:
  push:
    tags:
      - "v*-linux"
      - "v*-linux-preview.*"
      - "v*-linux-rc.*"

  workflow_run:
    workflows: ["Linux Build"]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-linux
  cancel-in-progress: false

jobs:
  release-linux:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Validate explicit release plan and trusted source commit
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare-release.py linux

      - uses: actions/setup-dotnet@v5
        if: steps.prepare.outputs.publish == 'true'
        with:
          dotnet-version: "8.0.x"

      - name: Verify tag, application version and release notes
        if: steps.prepare.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          project = Path("src/ToastifyReloaded.Linux")
          version = ET.parse(project / "ToastifyReloaded.Linux.csproj").findtext("./PropertyGroup/Version")
          tag = os.environ["RELEASE_TAG"]
          source = (project / "Services/LinuxUpdateService.cs").read_text()
          current = re.search(r'public const string CurrentTag = "([^"]+)";', source)
          assert current and current.group(1) == tag, "Pushed tag does not match Linux CurrentTag"
          assert version and re.fullmatch(r"v" + re.escape(version) + r"-linux(?:-(?:preview|rc)\.[1-9][0-9]*)?", tag), "Linux tag and project version differ"
          assert Path("docs/releases", tag + ".md").is_file(), "Version-specific release notes are missing"
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("LINUX_PACKAGE_VERSION=" + version + "\n")
          print("PASS: tag, application version and release notes match:", tag)
          PY

      - name: Install dependencies
        if: steps.prepare.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            playerctl xbindkeys xdg-desktop-portal dbus-x11 xdg-utils \
            libx11-6 libice6 libsm6 libfontconfig1 libxext6 \
            libxrender1 libxrandr2 libxi6 libgl1 libglib2.0-0 \
            desktop-file-utils curl file xvfb xauth

      - name: Test track links and safe launcher fallbacks
        if: steps.prepare.outputs.publish == 'true'
        run: dotnet run --project tests/ToastifyReloaded.TrackLink.Tests -c Release

      - name: Build x64 and ARM64
        if: steps.prepare.outputs.publish == 'true'
        run: |
          chmod +x scripts/build-linux.sh scripts/build-linux-arm64.sh
          ./scripts/build-linux.sh
          ./scripts/build-linux-arm64.sh

      - name: Linux headless self-test and GUI startup smoke test
        if: steps.prepare.outputs.publish == 'true'
        run: |
          chmod +x scripts/test-linux-rc.sh scripts/test-linux-ci.sh
          ./scripts/test-linux-rc.sh
          ./scripts/test-linux-ci.sh

      - name: Validate Linux desktop entry
        if: steps.prepare.outputs.publish == 'true'
        run: |
          desktop-file-validate packaging/linux/io.github.Marlius92.ToastifyReloaded.desktop

      - name: Package release
        if: steps.prepare.outputs.publish == 'true'
        run: |
          chmod +x scripts/package-linux-*.sh
          ./scripts/package-linux-tar.sh
          ./scripts/package-linux-deb.sh "$LINUX_PACKAGE_VERSION"
          ./scripts/package-linux-appimage.sh
          ./scripts/package-linux-arm64-tar.sh
          ./scripts/package-linux-arm64-deb.sh "$LINUX_PACKAGE_VERSION"

      - name: Validate release package set
        if: steps.prepare.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          X64_TAR="dist/ToastifyReloaded-Linux-x64.tar.gz"
          X64_APPIMAGE="dist/ToastifyReloaded-Linux-x64.AppImage"
          ARM64_TAR="dist/ToastifyReloaded-Linux-arm64.tar.gz"

          X64_DEB="dist/toastify-reloaded_${LINUX_PACKAGE_VERSION}_amd64.deb"
          ARM64_DEB="dist/toastify-reloaded_${LINUX_PACKAGE_VERSION}_arm64.deb"

          test -s "$X64_TAR"
          test -s "$X64_APPIMAGE"
          test -x "$X64_APPIMAGE"

          APPIMAGE_CHECK="$RUNNER_TEMP/toastify-release-appimage"
          rm -rf "$APPIMAGE_CHECK"
          mkdir -p "$APPIMAGE_CHECK"
          (
            cd "$APPIMAGE_CHECK"
            "$GITHUB_WORKSPACE/$X64_APPIMAGE" --appimage-extract >/dev/null
          )
          test -x "$APPIMAGE_CHECK/squashfs-root/AppRun"
          test -x "$APPIMAGE_CHECK/squashfs-root/usr/bin/toastify-reloaded"
          test -x "$APPIMAGE_CHECK/squashfs-root/usr/lib/toastify-reloaded/ToastifyReloaded.Linux"
          grep -Fq 'Exec=toastify-reloaded' "$APPIMAGE_CHECK/squashfs-root/io.github.Marlius92.ToastifyReloaded.desktop"

          test -s "$ARM64_TAR"
          test -n "$X64_DEB"
          test -s "$X64_DEB"
          test -n "$ARM64_DEB"
          test -s "$ARM64_DEB"

          X64_TAR_LIST="$RUNNER_TEMP/x64-tar.txt"
          ARM64_TAR_LIST="$RUNNER_TEMP/arm64-tar.txt"
          X64_DEB_INFO="$RUNNER_TEMP/x64-deb-info.txt"
          ARM64_DEB_INFO="$RUNNER_TEMP/arm64-deb-info.txt"

          tar -tzf "$X64_TAR" > "$X64_TAR_LIST"
          tar -tzf "$ARM64_TAR" > "$ARM64_TAR_LIST"
          dpkg-deb --info "$X64_DEB" > "$X64_DEB_INFO"
          dpkg-deb --info "$ARM64_DEB" > "$ARM64_DEB_INFO"

          grep -Fq 'ToastifyReloaded.Linux' "$X64_TAR_LIST"
          grep -Fq 'ToastifyReloaded.Linux' "$ARM64_TAR_LIST"
          grep -Fq 'Architecture: amd64' "$X64_DEB_INFO"
          grep -Fq 'Architecture: arm64' "$ARM64_DEB_INFO"

          test "$(dpkg-deb --field "$X64_DEB" Version)" = "$LINUX_PACKAGE_VERSION"
          test "$(dpkg-deb --field "$ARM64_DEB" Version)" = "$LINUX_PACKAGE_VERSION"

          (
            cd dist
            sha256sum \
              ToastifyReloaded-Linux-x64.tar.gz \
              ToastifyReloaded-Linux-x64.AppImage \
              "toastify-reloaded_${LINUX_PACKAGE_VERSION}_amd64.deb" \
              ToastifyReloaded-Linux-arm64.tar.gz \
              "toastify-reloaded_${LINUX_PACKAGE_VERSION}_arm64.deb" \
              > SHA256SUMS.txt
          )

          cat dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: steps.prepare.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prepare.outputs.release_tag }}
          target_commitish: ${{ steps.prepare.outputs.release_sha }}
          body_path: ${{ steps.prepare.outputs.notes_path }}
          name: Toastify Reloaded ${{ steps.prepare.outputs.release_tag }}
          prerelease: ${{ contains(steps.prepare.outputs.release_tag, '-preview.') || contains(steps.prepare.outputs.release_tag, '-rc.') }}
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/ToastifyReloaded-Linux-x64.tar.gz
            dist/ToastifyReloaded-Linux-x64.AppImage
            dist/toastify-reloaded_${{ env.LINUX_PACKAGE_VERSION }}_amd64.deb
            dist/ToastifyReloaded-Linux-arm64.tar.gz
            dist/toastify-reloaded_${{ env.LINUX_PACKAGE_VERSION }}_arm64.deb
            dist/SHA256SUMS.txt
